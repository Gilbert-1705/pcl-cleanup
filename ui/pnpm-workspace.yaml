# nosemgrep: package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy, package_managers.pnpm.pnpm-trust-policy
packages:
  - .

savePrefix: ''

allowBuilds: {}

# The libraries come from the Prusa Connect Local source tree in ../.core
# (see Makefile). They are not on npm yet.
overrides:
  '@prusa/connect': 'link:../.core/packages/typescript'
  '@prusa/connect-ui': 'link:../.core/packages/svelte'
  '@prusa/frontend-standards': 'file:../.core/packages/standards'
  # SEC-0015: minimatch below 11.0.1 has a ReDoS (GHSA-g3hv-75wg-m249). It comes
  # only through @typescript-eslint in @prusa/frontend-standards, a lint tool
  # that neither the type check nor the page bundle runs. Drop this once
  # typescript-eslint itself asks for minimatch 11.
  minimatch: '11.0.9'

autoInstallPeers: false

# Supply-chain hardening (pnpm >= 10.26):
# - Transitive dependencies only from the registry, never from git or tarball URLs.
#   The link:/file: overrides above are direct dependencies and not affected.
# - Accept new package versions only after seven days (10080 minutes).
# trustPolicy (no-downgrade) is deliberately off: in the toolchain (e.g. @types/node,
# undici-types, chokidar) current versions lack a provenance attestation that older
# ones had, which blocks every install. Re-test whenever CORE_COMMIT changes.
blockExoticSubdeps: true
minimumReleaseAge: 10080
