# Cleanup for Prusa Connect Local.
#
# One module with both halves: the Go process (main.go), which scans the
# storages and plans the rules, and a page "Cleanup" under Extensions in the
# sidebar. The page is English with a German translation (ui/src/locales);
# the texts in this file are English.
#
# Install (see README.md):
#   prusa-connect module add github.com/gilbert-1705/pcl-cleanup@0.5.0 -from <release> -approve

name: cleanup
title: Cleanup
summary: Deletes old camera snapshots, timelapses and images of other extensions by per-folder rules, and optionally old print files on a printer's USB drive. Shows first what would go and how storage is used, then deletes with your own rights.
codeowner: Gilbert-1705
kind: sink
version: 0.5.0
license: MIT
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - darwin_amd64

# The Prusa Connect versions this release runs on (the first that reads
# license), then the capabilities the process calls.
require:
  core: ">=0.1.0-beta.1"
  core-storage.list: "*"
  core-access.check: "*"
  core-device.get: "*"
  core-device.jobs: "*"
  core-device.files: "*"
  # Only the optional automatic printer run (printer_auto) sends delete_file.
  core-device.command: "*"

# read_storage: the module reads storages, for the person on the page with
# their rights and as itself to find the copies for the automatic printer run.
# It never deletes in a storage: the page does, with the signed-in person's
# rights. The module protocol has no call to delete in a storage yet, so
# storage rules do not run on their own (ROADMAP.md). By hand, printers are
# read for the person on the page, with their rights. The module holds no
# right on any printer unless the operator grants its instance the operator
# role on one for the automatic printer run (printer_auto, off by default);
# install does not write that grant.
permissions:
  - read_storage

# Asked, never taken: whether the person saving or removing a rule may delete
# there (write_storage on storages, operate on the printer), and again before
# every automatic printer run for the person who saved the rule (policy.go).
# observe: the page shows what a printer rule did on a printer, and who saved
# a rule, only to a person who may see that printer (visibility.go).
checks:
  - write_storage
  - operate
  - observe
# The automatic printer run asks about the rule's author, who is usually not on
# the page at that moment.
check_absent_people: true

needs:
  # Rules (regeln.json) and history (verlauf.json).
  data: true

# No egress: the process makes no network connection. It talks to Prusa
# Connect Local only through the module protocol on its standard input and
# output.

options:
  - key: auto_interval
    type: duration
    default: "0s"
    summary: How often the active printer rules run on their own, e.g. 6h; 0s turns it off. Needs printer_auto. Storage rules run from the page only.
  - key: allowed_storages
    type: list
    default: '["local"]'
    summary: The storages rules may point at; "*" allows all. A rule outside the list is neither saved nor run.
  - key: allowed_devices
    type: list
    default: "[]"
    summary: The printers (ids) on whose own storage rules may delete print files; "*" allows all, empty none.
  - key: printer_auto
    type: bool
    default: "false"
    summary: Printer rules may be active and run every auto_interval, as the extension itself. Also needs the operator role for the extension's instance on each printer (see README). That role would also let it start prints; the extension only sends delete_file.
  - key: printer_auto_max
    type: int
    default: "50"
    summary: The most files one automatic run deletes per printer rule, the oldest first. 1 to 500.
  - key: printer_auto_dry_run
    type: bool
    default: "true"
    summary: Dry run. The automatic printer run deletes nothing and only writes to the history what it would delete.

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: cleanup
        title: Cleanup
        icon: wrench
