# Cleanup for Prusa Connect Local.
#
# One module with both halves: the Go process (main.go), which scans the
# storages and applies the rules, and a page "Aufräumen" under Extensions in
# the sidebar. The page and the settings are German; title, summary and the
# egress entry are English for the Plugin Marketplace.
#
# Install (see README.md):
#   prusa-connect module add github.com/gilbert-1705/pcl-cleanup@0.4.1 -from <release> -approve

name: cleanup
title: Cleanup
summary: Deletes old camera snapshots, timelapses and images of other extensions by per-folder rules, and optionally old print files on a printer's USB drive. Shows first what would go and how storage is used.
codeowner: Gilbert-1705
kind: sink
version: 0.4.1
license: MIT
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - darwin_amd64

# The Prusa Connect versions this release runs on (the first that reads
# license), then the capabilities the process calls.
require:
  core: ">=0.1.0-beta.1"
  core-storage.list: "*"
  core-access.check: "*"
  core-device.get: "*"
  core-device.jobs: "*"
  core-device.files: "*"
  # Only the optional automatic printer run (printer_auto) sends delete_file.
  core-device.command: "*"

# read_storage: scan the storages for the automatic run. Deleting happens from
# the page with the signed-in person's rights or, automatically, with the API
# token. By hand, printers are read for the person on the page, with their
# rights. The module holds no right on any printer unless the operator grants
# its instance the operator role on one for the automatic printer run
# (printer_auto, off by default); install does not write that grant.
permissions:
  - read_storage

# Asked, never taken: whether the person saving a rule may delete there
# (write_storage on storages, operate on the printer), and again before every
# automatic run for the person who saved the rule. See policy.go.
checks:
  - write_storage
  - operate
# The automatic run asks about the rule's author, who is usually not on the
# page at that moment.
check_absent_people: true

needs:
  # Rules (regeln.json) and history (verlauf.json).
  data: true

# One connection, and it goes back to this server itself, not to a third party.
# The module protocol can list storages but cannot delete, so the automatic
# run for storage rules calls the server's own HTTP API
# (POST /api/v1/storages/{storage}/deletions) with the API token the operator
# created for it. core_url defaults to http://127.0.0.1:8080, the address and
# port a Prusa Connect server listens on unless its config says otherwise
# (core.api.addr). A server set up on another port, behind a reverse proxy or
# in a container with host networking (for example :8087) is reached on that
# port instead, so the port is whatever core_url names; 80 and 443 cover a
# server behind a proxy. Without api_token and auto_interval the process makes
# no connection at all. The automatic printer run (printer_auto) needs none:
# it uses the module protocol (device.files, device.command delete_file).
egress:
  - option: core_url
    ports: [8080, 80, 443]
    from: process
    why: "Automatic storage cleanup only: deletes through this server's own HTTP API, as the module protocol cannot delete. core_url is this server's address; its port is the server's (8080 by default)."
    sends: "Paths of files to delete in this server's own storages, and the API token (scope operate) set in api_token. core_url points back at this server, so nothing leaves it unless the operator sets another host."

options:
  - key: core_url
    type: url
    default: http://127.0.0.1:8080
    summary: Adresse dieses Servers aus Sicht des Moduls, für den automatischen Lauf.
  - key: api_token
    type: secret
    default: ""
    summary: API-Zugang mit dem Umfang operate (Einstellungen → API-Zugangsdaten). Ohne ihn löscht nur der Knopf auf der Seite.
  - key: auto_interval
    type: duration
    default: "0s"
    summary: Wie oft die aktiven Regeln automatisch laufen, z. B. 6h. 0s schaltet das aus. Speicher-Regeln brauchen dazu api_token, Drucker-Regeln printer_auto.
  - key: allowed_storages
    type: list
    default: '["local"]'
    summary: Die Speicher, auf die Regeln zeigen dürfen. "*" erlaubt alle. Was nicht in der Liste steht, wird weder gespeichert noch aufgeräumt.
  - key: allowed_devices
    type: list
    default: "[]"
    summary: Die Drucker (IDs), auf deren eigenem Speicher Regeln Druckdateien löschen dürfen. "*" erlaubt alle, leer keinen.
  - key: printer_auto
    type: bool
    default: "false"
    summary: Drucker-Regeln dürfen aktiv sein und laufen alle auto_interval, als Erweiterung selbst. Braucht zusätzlich je Drucker die Operator-Rolle für die Instanz (siehe README). Damit könnte die Erweiterung auch Drucke starten; sie sendet aber nur delete_file.
  - key: printer_auto_max
    type: int
    default: "50"
    summary: Höchstens so viele Dateien löscht ein automatischer Lauf je Drucker-Regel, die ältesten zuerst. 1 bis 500.
  - key: printer_auto_dry_run
    type: bool
    default: "true"
    summary: Probelauf. Der automatische Drucker-Lauf löscht nichts und schreibt nur in den Verlauf, was er löschen würde.

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: cleanup
        title: Aufräumen
        icon: wrench
