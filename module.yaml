# Cleanup for Prusa Connect Local.
#
# One module with both halves: the Go process (main.go), which scans the
# storages and applies the rules, and a page "Aufräumen" under Extensions in
# the sidebar. User-facing texts are German.
#
# Install (see README.md):
#   prusa-connect module add github.com/gilbert-1705/pcl-cleanup@0.4.0 -from <release> -approve

name: cleanup
title: Aufräumen
summary: Löscht alte Kamera-Snapshots, Zeitraffer und Bilder anderer Erweiterungen nach Regeln je Ordner, auf Wunsch auch alte Druckdateien vom USB-Speicher eines Druckers. Zeigt vorher, was weg kann, und wie sich der Speicher verteilt.
codeowner: Gilbert-1705
kind: sink
version: 0.4.0
license: MIT
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - darwin_amd64

require:
  core-storage.list: "*"
  core-access.check: "*"
  core-device.get: "*"
  core-device.jobs: "*"
  core-device.files: "*"
  # Only the optional automatic printer run (printer_auto) sends delete_file.
  core-device.command: "*"

# read_storage: scan the storages for the automatic run. Deleting happens from
# the page with the signed-in person's rights or, automatically, with the API
# token. By hand, printers are read for the person on the page, with their
# rights. The module holds no right on any printer unless the operator grants
# its instance the operator role on one for the automatic printer run
# (printer_auto, off by default); install does not write that grant.
permissions:
  - read_storage

# Asked, never taken: whether the person saving a rule may delete there
# (write_storage on storages, operate on the printer), and again before every
# automatic run for the person who saved the rule. See policy.go.
checks:
  - write_storage
  - operate
# The automatic run asks about the rule's author, who is usually not on the
# page at that moment.
check_absent_people: true

needs:
  # Rules (regeln.json) and history (verlauf.json).
  data: true

egress:
  - option: core_url
    ports: [8080, 80, 443]
    from: process
    why: Löscht beim automatischen Lauf über die HTTP-API des eigenen Servers, weil das Modulprotokoll keine Löschung kennt. Der Port ist der aus core_url, wenn der Server nicht auf 8080 läuft.
    sends: Die Pfade der zu löschenden Dateien und das API-Token.

options:
  - key: core_url
    type: url
    default: http://127.0.0.1:8080
    summary: Adresse dieses Servers aus Sicht des Moduls, für den automatischen Lauf.
  - key: api_token
    type: secret
    default: ""
    summary: API-Zugang mit dem Umfang operate (Einstellungen → API-Zugangsdaten). Ohne ihn löscht nur der Knopf auf der Seite.
  - key: auto_interval
    type: duration
    default: "0s"
    summary: Wie oft die aktiven Regeln automatisch laufen, z. B. 6h. 0s schaltet das aus. Speicher-Regeln brauchen dazu api_token, Drucker-Regeln printer_auto.
  - key: allowed_storages
    type: list
    default: '["local"]'
    summary: Die Speicher, auf die Regeln zeigen dürfen. "*" erlaubt alle. Was nicht in der Liste steht, wird weder gespeichert noch aufgeräumt.
  - key: allowed_devices
    type: list
    default: "[]"
    summary: Die Drucker (IDs), auf deren eigenem Speicher Regeln Druckdateien löschen dürfen. "*" erlaubt alle, leer keinen.
  - key: printer_auto
    type: bool
    default: "false"
    summary: Drucker-Regeln dürfen aktiv sein und laufen alle auto_interval, als Erweiterung selbst. Braucht zusätzlich je Drucker die Operator-Rolle für die Instanz (siehe README). Damit könnte die Erweiterung auch Drucke starten; sie sendet aber nur delete_file.
  - key: printer_auto_max
    type: int
    default: "50"
    summary: Höchstens so viele Dateien löscht ein automatischer Lauf je Drucker-Regel, die ältesten zuerst. 1 bis 500.
  - key: printer_auto_dry_run
    type: bool
    default: "true"
    summary: Probelauf. Der automatische Drucker-Lauf löscht nichts und schreibt nur in den Verlauf, was er löschen würde.

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: cleanup
        title: Aufräumen
        icon: wrench
